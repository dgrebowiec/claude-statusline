[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-statusline"
dynamic = ["version"]  # from claude_statusline/__init__.py
description = "Claude Code status line: context size, 5h/7d plan limits, prompt cache TTL and this session's share of the limits."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []  # standard library only

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
claude-statusline = "claude_statusline.cli:main"

[tool.setuptools]
packages = ["claude_statusline"]

[tool.setuptools.dynamic]
version = { attr = "claude_statusline.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
